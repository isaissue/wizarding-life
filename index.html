<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Wizarding Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a night-time ledger lit by candlelight. Identity card + vitals left, the year-by-year record right. Single dark theme by choice. */
:root{
  --night:#0f1420; --card:#171e2d; --ink:#e9e4d6; --muted:#9a9a9a; --rule:#2b3447;
  --candle:#e2b65a; --candle-soft:#3a3222;
  --good:#7cc59a; --bad:#e58a7c;
  --gryffindor:#c8463c; --slytherin:#3e9a6a; --ravenclaw:#4f7fd0; --hufflepuff:#e0b83c;
  --display:"IM Fell English", "Noto Serif TC", Georgia, "Times New Roman", serif;
  --body:"Spectral", "Noto Serif TC", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:20px 16px 40px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:22px}
.brand{font-family:var(--display);font-size:30px;line-height:1.1}
.brand em{color:var(--candle)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
.btn{border:1px solid var(--candle);background:var(--candle);color:#1a1408;padding:10px 18px;border-radius:4px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.btn.ghost:hover{border-color:var(--candle)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hidden{display:none !important}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:flex;gap:4px}
.lang .chip{padding:3px 10px;font-size:13px}
:lang(zh-Hant) .hero h1{line-height:1.2;letter-spacing:.02em}
:lang(zh-Hant) body{line-height:1.7}
.sect{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}

/* Start */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:start}
.hero h1{font-family:var(--display);font-size:clamp(40px,6.5vw,66px);line-height:1.02}
.hero h1 em{color:var(--candle)}
.hero p{max-width:60ch}
.note{font-size:14px;color:var(--muted);max-width:62ch}
.eras{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--ink);padding:5px 11px;border-radius:14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--candle);border-color:var(--candle);color:#1a1408}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0 14px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px}
table.ref{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.ref th{font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--rule)}
table.ref th:first-child,table.ref td:first-child{text-align:left}
table.ref td{font-family:var(--mono);text-align:right;padding:4px 6px;border-bottom:1px dashed var(--rule)}
.refnote{font-size:12px;color:var(--muted);margin-top:8px}
.timeline{margin-top:16px;display:grid;gap:4px;font-size:14px}
.timeline div{display:grid;grid-template-columns:58px 1fr;gap:8px}
.timeline span{font-family:var(--mono);color:var(--candle);font-size:12px;padding-top:2px}
.pastrow{font-size:14px;padding:6px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px}
.pastrow span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12px}

/* Game */
.game{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.idcard{border-top:4px solid var(--hc,var(--rule))}
.idcard .name{font-family:var(--display);font-size:30px;line-height:1.1}
.idcard .meta{font-size:14px;color:var(--muted);margin-top:4px}
.agebig{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:10px}
.agebig b{font-family:var(--display);font-weight:400;font-size:44px;color:var(--ink);line-height:1}
.era{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:10px;background:var(--candle-soft);color:var(--candle)}
.era.war{background:#3a1f22;color:var(--bad)}
.fields{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
.fields dt{color:var(--muted)}
.fields dd{margin:0}
.stats{display:grid;gap:9px;margin-top:14px}
.stat{display:grid;grid-template-columns:98px 1fr 30px;gap:8px;align-items:center;font-size:14px}
.stat .track{height:8px;background:var(--candle-soft);border-radius:4px;overflow:hidden}
.stat .fill{height:100%;border-radius:4px;background:var(--candle);transition:width .3s}
.stat .fill.low{background:var(--bad)}
.stat .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.focus{display:flex;flex-wrap:wrap;gap:6px}
.focushint{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.logpanel{padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 110px);min-height:440px}
.loghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.loghead h2{font-family:var(--display);font-size:24px}
.log{overflow-y:auto;padding:6px 16px 16px;flex:1}
.yr{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.yr .when{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.yr .when b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.yr ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.yr li{font-size:15px}
.yr li.major{font-weight:600}
.yr li.bad{color:var(--bad)} .yr li.good{color:var(--good)}
.yr li.meet{color:var(--candle)}
.yr li.world{font-style:italic;color:#c9c2b0}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.scrim.open{display:flex}
.modal{background:var(--card);border-radius:8px;max-width:500px;width:100%;padding:22px;border:1px solid var(--candle);max-height:90vh;overflow:auto}
.modal .kicker{font-family:var(--mono);font-size:12px;color:var(--candle)}
.modal h3{font-family:var(--display);font-size:30px;line-height:1.12;margin:4px 0 8px}
.modal p{margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:transparent;color:var(--ink);padding:10px 12px;border-radius:6px}
.opt:hover:not([disabled]){border-color:var(--candle);background:var(--candle-soft)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt[disabled]{opacity:.4;cursor:not-allowed}

/* End */
.record{max-width:740px;margin:0 auto}
.record .panel{padding:24px;border-top:4px solid var(--hc,var(--rule))}
.record h2{font-family:var(--display);font-size:46px;line-height:1.05}
.record .life{font-family:var(--mono);color:var(--muted);font-size:13px;margin-top:6px}
.record .cause{margin-top:14px;font-size:17px}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0}
.compare div{font-size:13px;color:var(--muted)}
.compare b{display:block;font-family:var(--display);font-weight:400;font-size:32px;color:var(--ink);line-height:1.1}
.metlist{display:flex;flex-wrap:wrap;gap:6px}
.metlist span{border:1px solid var(--candle);color:var(--candle);border-radius:12px;padding:2px 10px;font-size:13px}
.highlights{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.highlights li{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:15px}
.highlights li span{font-family:var(--mono);color:var(--muted);font-size:12px;padding-top:3px}
.epitaph{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.35;margin-top:18px}
@media (max-width:840px){ .hero,.game{grid-template-columns:1fr} .logpanel{max-height:none} }
@media (max-width:440px){ .compare{grid-template-columns:1fr} .stat{grid-template-columns:86px 1fr 28px} }
@media (prefers-reduced-motion: reduce){ .stat .fill{transition:none} }

/* Tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--display);font-size:20px;padding:4px 8px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--candle)}
.tab .count{font-family:var(--mono);font-size:11px;background:var(--candle-soft);color:var(--candle);border-radius:8px;padding:1px 6px;vertical-align:middle}
/* Daily Prophet: a sheet of newsprint inside the dark room */
.paper{background:#e8e0ca;color:#231c12;border-radius:4px;padding:18px 20px;margin-top:10px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.paper .mast{font-family:var(--display);font-size:clamp(30px,5vw,44px);text-align:center;line-height:1;border-bottom:3px double #231c12;padding-bottom:8px}
.paper .dateline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;border-bottom:1px solid #231c12;padding:6px 0;margin-bottom:12px}
.paper select{font:inherit;background:#f4eedd;color:#231c12;border:1px solid #8a7d62;border-radius:3px;padding:1px 4px}
.paper .headline{font-family:var(--display);font-size:clamp(24px,3.6vw,32px);line-height:1.15;margin:4px 0 12px;text-align:center}
.paper .cols{column-count:2;column-gap:20px;column-rule:1px solid #b8ab8c;font-size:14px}
.paper .cols p{margin:0 0 10px;break-inside:avoid}
.paper .cols b{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b5a35}
.paper .notices{border:1px solid #231c12;padding:8px 12px;margin-top:8px;font-size:14px}
.paper .notices .nh{font-family:var(--display);font-size:18px;border-bottom:1px solid #b8ab8c;margin-bottom:6px}
.paper .notices p{margin:0 0 4px}
.paper .price{font-family:var(--mono);font-size:10px;text-align:right;margin-top:10px;color:#6b5a35}
@media (max-width:560px){ .paper .cols{column-count:1} }
/* Relationships */
.relsum{font-size:14px;color:var(--muted);margin:10px 0 0}
.person{display:grid;grid-template-columns:1fr 90px 96px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.person .pn b{font-weight:500;display:block}
.person .pn small{color:var(--muted);font-size:12px}
.person.gone{opacity:.55}
.cbar{height:6px;background:var(--candle-soft);border-radius:3px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--candle)}
.pill{font-family:var(--mono);font-size:11px;text-align:center;border:1px solid var(--rule);border-radius:10px;padding:2px 6px;color:var(--muted)}
.pill.best{border-color:var(--candle);color:#1a1408;background:var(--candle)}
.pill.close{border-color:var(--candle);color:var(--candle)}
.pill.rival{border-color:var(--bad);color:var(--bad)}
.pill.dead{border-style:dashed}
@media (max-width:440px){ .person{grid-template-columns:1fr 70px} .person .cbar{display:none} }

/* Three-column game layout: info | life record | Prophet over relationships */
.hero{max-width:1120px;margin:0 auto}
.game3{grid-template-columns:300px minmax(0,1fr) minmax(0,1fr)}
.rightcol{display:grid;grid-template-rows:1fr 1fr;gap:20px;height:calc(100vh - 110px);min-height:640px}
.sidepanel{padding:0;display:flex;flex-direction:column;min-height:0}
.sidepanel .loghead h2,.logpanel .loghead h2{font-family:var(--display);font-size:22px}
.loghead h2 .count{font-family:var(--mono);font-size:11px;background:var(--candle-soft);color:var(--candle);border-radius:8px;padding:1px 6px;vertical-align:middle}
.logpanel{height:calc(100vh - 110px);max-height:none;min-height:640px}
.sidepanel .paper{margin:10px 0}
.sidepanel .paper .mast{font-size:32px}
.sidepanel .paper .headline{font-size:24px}
.sidepanel .paper .cols{column-count:1}
.sidepanel .person{grid-template-columns:1fr 70px 84px}
@media (max-width:1200px){
  .game3{grid-template-columns:300px minmax(0,1fr)}
  .rightcol{grid-column:1/-1;grid-template-rows:none;grid-template-columns:1fr 1fr;height:auto;min-height:0}
  .sidepanel{max-height:640px}
}
@media (max-width:840px){
  .game3{grid-template-columns:1fr}
  .rightcol{grid-template-columns:1fr}
  .logpanel{height:auto;max-height:70vh;min-height:360px}
}

/* Year controls sit above the life record */
.topcontrols{margin:0;padding:12px 16px;border-bottom:1px solid var(--rule)}

/* House points */
table.hp{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.hp td{padding:4px 0;border-bottom:1px dashed var(--rule)}
table.hp td:first-child{width:42%;white-space:nowrap}
table.hp td:first-child i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
table.hp td.bar{padding:0 8px}
table.hp td.bar span{display:block;height:6px;border-radius:3px;opacity:.85}
table.hp td.n{font-family:var(--mono);font-size:12px;text-align:right;width:44px;color:var(--muted)}
table.hp tr.mine td{color:var(--ink);font-weight:600}
table.hp tr.mine td.n{color:var(--candle)}
table.hp .cup{font-family:var(--mono);font-size:10px;font-weight:500;color:#1a1408;background:var(--candle);border-radius:8px;padding:0 5px;margin-left:4px}
.hpnote{font-size:12px;color:var(--muted);margin-top:6px}

.btn.waiting{box-shadow:0 0 0 3px var(--candle-soft)}

/* Timetable form and panel */
.tt{display:grid;gap:6px}
.ttrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:14px}
.ttrow select{font:inherit;font-size:14px;background:var(--night);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:5px 6px;width:100%}
.ttrow select:focus-visible,.ttrow input:focus-visible{outline:2px solid var(--candle);outline-offset:1px}
.ttcheck input{justify-self:start;width:18px;height:18px;accent-color:var(--candle)}
.ttbreak{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:1px dashed var(--rule);padding-top:6px;margin-top:2px}
.tterr{color:var(--bad);font-size:13px;margin:4px 0 0}
.ttbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.ttbtns .opt{width:auto}
table.ttv{width:100%;border-collapse:collapse;font-size:13px}
table.ttv td{padding:3px 0;border-bottom:1px dashed var(--rule)}
table.ttv td:first-child{font-family:var(--mono);font-size:11px;color:var(--muted);width:56px}
table.ttv tr.brk td{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table.ttv .free{color:var(--bad)}
@media (max-width:440px){ .ttrow{grid-template-columns:1fr} }

/* Inventory */
ul.inv{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
ul.inv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--rule);font-size:13px}
ul.inv li b{font-weight:500;display:block}
ul.inv li small{color:var(--muted);font-size:11px;font-family:var(--mono)}
ul.inv .sell{border:1px solid var(--candle);background:transparent;color:var(--candle);border-radius:10px;font-size:11px;padding:2px 8px;white-space:nowrap}
ul.inv .sell:hover{background:var(--candle-soft)}

/* Yearly focus sits under the year buttons, above the life record */
.focusbar{padding:10px 16px 12px;border-bottom:1px solid var(--rule)}
.focusbar .sect{margin:0 0 8px}
.focusbar .focushint{min-height:0;margin-top:6px}

/* Pixel portrait */
.portrait{display:flex;gap:12px;align-items:center;margin-top:10px}
.portrait canvas,.endtop canvas{width:80px;height:80px;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--night);border:1px solid var(--rule);border-radius:4px;flex:none}
.pxstage{font-family:var(--mono);font-size:11px;color:var(--candle);text-transform:uppercase;letter-spacing:.06em}
.pxtext{font-size:13px;color:var(--muted);margin-top:2px}
.endtop{display:flex;gap:16px;align-items:center}

/* Achievements */
.yr li.ach{color:var(--candle);font-weight:600}
.achs{display:flex;flex-wrap:wrap;gap:5px}
.achs span{font-size:12px;border:1px solid var(--candle);color:var(--candle);border-radius:10px;padding:1px 8px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:320px;overflow-y:auto}
.achcard{border:1px dashed var(--rule);border-radius:6px;padding:7px 9px;opacity:.5}
.achcard b{display:block;font-size:13px;font-weight:500}
.achcard small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.achcard.got{opacity:1;border:1px solid var(--candle)}
.achcard.got b{color:var(--candle)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:20;max-width:320px}
.toast{background:var(--card);border:1px solid var(--candle);border-radius:8px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:opacity .4s,transform .4s}
.toast b{display:block;color:var(--candle);font-size:14px}
.toast span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.toast.out{opacity:0;transform:translateY(8px)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" data-i="brand"></div>
    <div class="hdr-right">
      <span class="tag" data-i="brandsub"></span>
      <div class="lang" role="group" aria-label="Language / 語言">
        <button class="chip" id="langEn" data-lang="en">EN</button>
        <button class="chip" id="langZh" data-lang="zh">繁中</button>
      </div>
    </div>
  </header>

  <section id="start">
    <div class="hero">
      <div>
        <h1 data-i="h1"></h1>
        <p style="margin-top:16px" data-i="intro"></p>
        <div class="sect" data-i="born"></div>
        <div class="eras" id="eraPick"></div>
        <div class="cta"><button class="btn" id="bornBtn" data-i="bornBtn"></button><span class="note" data-i="bornNote"></span></div>
        <p class="note" data-i="warn"></p>
        <div id="achStart"></div>
        <div id="pastWrap" class="hidden"><div class="sect" data-i="past"></div><div id="pastList"></div></div>
      </div>
      <aside class="panel">
        <div class="sect" style="margin-top:0" data-i="refTitle"></div>
        <table class="ref"><thead><tr><th data-i="th1"></th><th data-i="th2"></th><th data-i="th3"></th><th data-i="th4"></th></tr></thead><tbody id="refTable"></tbody></table>
        <p class="refnote" data-i="refnote"></p>
        <div class="sect" data-i="momentsTitle"></div>
        <div class="timeline" id="timeline"></div>
      </aside>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="game game3">
      <div class="panel idcard" id="idcard">

function warRisk(){
  const y=Y(); let r=0;

    if(y>=1970&&y<=1981&&adult()){ r+=0.0015; if(L.blood==="muggle") r+=0.003; if(L.side==="order") r+=0.012; if(L.side==="de") r+=0.004; if(L.career==="Auror") r+=0.008; }

    if(y>=1914&&y<=1918&&L.gender==="m"&&L.age>=18&&L.age<=41) r+=0.025;

function deathProb(){
  const a=L.age-1, imr=ukAt(L.by,2)*(L.magical?0.5:1), le=ukAt(L.by,1);

function haveBaby(){
  const y=Y();
  const mmr=y<1935?0.004:y<1950?0.0015:y<1980?0.0002:0.0001;
  if(L.gender==="f"&&chance(mmr*(L.magical?0.5:1))){ die(C("complications during childbirth","分娩併發症")); return; }
  const pool=y<1945?FIRST.old:y<1985?FIRST.mid:FIRST.new;
  const cg=chance(0.5)?"m":"f"; const takenK=L.people.map(p=>p.name.e.split(" ")[0]).concat(L.first.e); const nm=pick(pool[cg].filter(x=>!takenK.includes(x.e)).concat([]).length?pool[cg].filter(x=>!takenK.includes(x.e)):pool[cg]);
  const kid=addPerson({name:B(`${nm.e} ${L.last.e}`,`${nm.z}·${L.last.z}`),role:"child",kin:cg==="m"?B("Son","兒子"):B("Daughter","女兒"),close:78,born:Y()});
  notice(B(`Births: to ${L.name.e}, ${cg==="m"?"a son":"a daughter"}, ${nm.e}.`,`出生：${L.name.z}喜獲${cg==="m"?"麟兒":"千金"}${nm.z}。`));
  L.kids++; L.lastBirth=Y(); mod("happy",8); mod("gold",-4); mod("friends",5);
  say(`Your child ${nm.e} is born.`,`你的孩子${nm.z}出生了。`,"major good");
  if(chance(ukAt(y,2)/1000*(L.magical?0.5:1))){ L.lostPending=nm; L.lostPid=kid.id; }
  if(L.magical){ L.kidHog=L.kidHog||[]; L.kidHog.push({nm,y:y+11}); }
}

function careerMilestones(){
  const a=L.age;
  if(!L.career||L.retired||L.azkaban) return;
  // finishing Auror / Healer training
  if(isTrainee()&&L.jobYears>=3){
    L.level=1; L.income=L.baseInc;
    const t=jobTitle();
    ask(K(),B("Training complete","結訓典禮"),B(`After three hard years you qualify as ${an(t.e)} ${t.e}. There's a small ceremony at ${L.career==="Auror"?"the Ministry":"St Mungo's"}.`,`經過三年艱苦的訓練，你正式成為${t.z}。${L.career==="Auror"?"魔法部":"聖蒙果"}舉辦了一場小小的結訓典禮。`),[
      O("Throw a party","辦一場派對",()=>{ say(`You qualify as ${an(t.e)} ${t.e} and throw a party nobody forgets.`,`你正式成為${t.z}，辦了一場讓人難忘的派對。`,"major good"); mod("gold",-5); mod("friends",8); mod("happy",6); }),
      O("Take your family out to dinner","請家人吃頓飯",()=>{ say(`You qualify as ${an(t.e)} ${t.e} and take your family to dinner in Diagon Alley.`,`你正式成為${t.z}，帶家人到斜角巷吃了一頓大餐。`,"major good"); mod("gold",-3); mod("friends",5); mod("happy",4); }),
      O("Go straight back to work","直接回去工作",()=>{ say(`You qualify as ${an(t.e)} ${t.e} and are back at your desk the next morning.`,`你正式成為${t.z}，隔天一早就回到崗位。`,"major"); mod("gold",3); }) ]);
    return;
  }
  // promotion offers
  const lvl=L.level||0;
  if(!isTrainee()&&lvl<3&&L.jobYears>=2){
    const p=0.06+Math.max(0,L.stats.magic-40)/500+(L.stats.rep-40)/400+(L.focus==="work"?0.1:0)+Math.min(L.jobYears,10)*0.006;
    if(chance(p)){
      const nx=ladder(L.career)[lvl+1];
      ask(K(),B("A promotion","升遷機會"),B(`You're offered the post of ${nx[0]}. More pay, and more pressure.`,`你獲得升任${nx[1]}的機會。薪水更高，壓力也更大。`),[
        O("Accept","接受",()=>{ L.level=lvl+1; L.income=L.baseInc*(1+0.3*L.level); say(`You're promoted to ${nx[0]}.`,`你升任${nx[1]}。`,"major good"); notice(B(`Appointments: ${L.name.e} becomes ${nx[0]}.`,`人事：${L.name.z}升任${nx[1]}。`)); mod("happy",5); mod("health",-2); mod("friends",-2); },"More Galleons; less time for health and friends","金加隆增加，但健康與人際的時間變少"),
        O("Ask for a pay rise instead","改要求加薪",()=>{ if(chance(0.5)){ L.income+=0.5; say("You stay in your post, with a pay rise.","你留在原職，但加了薪。","good"); } else { say("Your boss refuses the pay rise and gives the job to someone else.","老闆拒絕加薪，還把職位給了別人。","bad"); mod("happy",-3); } }),
        O("Decline","婉拒",()=>{ say("You turn it down. You like your work as it is.","你婉拒了。你喜歡現在的工作。"); mod("happy",2); },"Keep your work-life balance","保持工作與生活的平衡") ]);
      return;
    }
  }
  // Quidditch players retire young
  if(L.career==="Quidditch player"&&a>=33&&chance(0.35)){
    ask(K(),B("Hang up your broom?","退休掛掃帚？"),B("Your knees creak on every dive. It might be time to stop playing.","每次俯衝膝蓋都嘎吱作響。也許是時候退休了。"),[
      O("Become a coach","當教練",()=>{ setCareer("Quidditch coach",4); say("You retire from playing and start coaching.","你退休了，開始當教練。","major"); }),
      O("Become a commentator","當評論員",()=>{ setCareer("Quidditch commentator",3.8); say("You retire and become a match commentator on the Wizarding Wireless.","你退休了，成為巫師廣播的球賽評論員。","major"); }),
      O("Open a broom shop","開一間掃帚店",()=>{ setCareer("Broom shop owner",3.5); mod("gold",-10); say("You retire and open a broom shop in Diagon Alley.","你退休了，在斜角巷開了一間掃帚店。","major"); }),
      O("Keep playing one more season","再打一季",()=>{ say("You play on. The crowd still chants your name.","你繼續上場，觀眾依然高喊你的名字。"); mod("health",-4); }) ]);
  }
}

let PID=0;
function eraPool(y){ return y<1945?FIRST.old:y<1985?FIRST.mid:FIRST.new; }
function genName(g,y,pure){ let f,l,t=0; do{ f=pick((pure&&chance(0.5)?FIRST.pure:eraPool(y))[g]); l=pick(pure?SURN.pure:SURN.other); t++; }while(L&&t<30&&(f.e===L.first.e||l.e===L.last.e||L.people.some(p=>p.name.e===`${f.e} ${l.e}`))); return fullName(f,l); }
function addPerson(o){ const p=Object.assign({id:++PID,alive:true,close:30,role:"friend",since:Y()},o); L.people.push(p); return p; }
const friends=()=>L.people.filter(p=>p.alive&&(p.role==="friend"));
const rivals=()=>L.people.filter(p=>p.alive&&p.role==="rival");
function bump(p,v){ p.close=clamp(p.close+v); }
function statusOf(p){
  if(!p.alive) return B("Deceased","已故");
  if(p.role==="rival") return B("Rival","死對頭");
  if(p.role==="ex") return B("Ex","前任");
  if(p.role==="dating") return B("Dating","交往中");
  if(p.role==="partner") return B("Married","已婚");
  if(p.role!=="friend") return null;
  return p.close>=80?B("Best friend","摯友"):p.close>=60?B("Close friend","好友"):p.close>=35?B("Friend","朋友"):B("Acquaintance","點頭之交");
}
const HOUSE_B=h=>B(h,HZ[h]);
const YEARWORD=n=>B(["","first-year","second-year","third-year","fourth-year","fifth-year","sixth-year","seventh-year"][n]||"student",["","一年級生","二年級生","三年級生","四年級生","五年級生","六年級生","七年級生"][n]||"學生");

function peopleYear(){
  const y=Y();
  for(const p of L.people){
    if(!p.alive) continue;
    // parents age and die
    if(p.ageOff){

function makeFamily(){
  const cls = L.blood==="pure"&&L.p>0.7?"noble":L.p>0.72?"wealthy":L.p>0.3?"middle":"poor";
  L.fclass=cls; L.stats.rep={noble:55,wealthy:45,middle:35,poor:25}[cls]-(L.blood==="muggle"?5:0);
  if(cls==="noble") L.stats.gold=clamp(L.stats.gold+15);
  if(cls==="poor") L.stats.gold=clamp(L.stats.gold-8);
  const momMagic = L.blood==="pure"||L.blood==="squib"||(L.blood==="half"&&chance(0.5));
  const dadMagic = L.blood==="pure"||L.blood==="squib"||(L.blood==="half"&&!momMagic);
  const styleW = cls==="noble"?{warm:1,strict:4,distant:4,protective:1,fun:0.5}:cls==="poor"?{warm:3,strict:2,distant:2,protective:1,fun:2}:{warm:4,strict:2,distant:1,protective:2,fun:2};
  const style=()=>weighted(Object.keys(styleW),k=>styleW[k]);
  const mf=pick(eraPool(L.by-28).f.filter(x=>x.e!==L.first.e)), df=pick(eraPool(L.by-28).m.filter(x=>x.e!==L.first.e));
  const mk=(f,kin,mag)=>{ const st=style(); return addPerson({name:B(`${f.e} ${L.last.e}`,`${f.z}·${L.last.z}`),role:"family",kin,parent:true,magical:mag,style:st,job:parentJob(mag,cls,L.by),close:clamp(50+STYLE[st].d*6+rint(-5,5)),ageOff:rint(22,38)}); };
  mk(mf,B("Mother","母親"),momMagic); mk(df,B("Father","父親"),dadMagic);
  const tfr=ukAt(L.by,3), n=clamp(Math.round(tfr-1+R()-0.5+(L.blood==="pure"?0.5:0)),0,4);
  for(let i=0;i<n;i++){ const g=chance(0.5)?"m":"f", older=chance(0.5);
    const kin=g==="m"?(older?B("Older brother","哥哥"):B("Younger brother","弟弟")):(older?B("Older sister","姊姊"):B("Younger sister","妹妹"));
    const taken=L.people.map(p=>p.name.e.split(" ")[0]).concat(L.first.e);
    const f=pick(eraPool(L.by)[g].filter(x=>!taken.includes(x.e)));
    if(!f) continue;
    addPerson({name:B(`${f.e} ${L.last.e}`,`${f.z}·${L.last.z}`),role:"family",kin,close:rint(45,75),sib:true}); }
}

const CLUB_INTRO=B("Hogwarts has a variety of clubs, each with its own character. The Duelling Club is fierce and competitive. The Gobstones Club is noisy, friendly and slightly smelly. The choir sings at every feast, toads included. The Astronomy Club stays up all night on the Tower. The Wizard Chess Club is quiet, apart from the pieces. Which will you join?",
 "霍格華茲有各式各樣的社團，各有特色。決鬥社激烈又好勝；高布石社吵鬧、友善，還有點臭；合唱團在每次宴會上獻唱，連蟾蜍也一起；天文社整夜待在塔上；巫師棋社很安靜，除了棋子以外。你要加入哪一個？");
function clubAnnual(n){ if(n===1) clubChoice(1,true); else clubRecap(n); }
function clubRecap(n){
  const c=L.club, info=c&&c!=="none"?CLUB_INFO[c]:null;
  const ach=L.clubAch||[], near=L.clubNear||[];
  let line;
  if(!info) line=B("After a year without any club, you've had plenty of free time, and a little too much homework.","一整年沒參加社團，你多了很多空閒時間，也多了一點太多的作業。");
  else if(ach.length) line=B(`After a whole year in ${info.n.e}, ${ach.map(a=>a.e).join(", and ")}.`,`在${info.n.z}待了一整年，${ach.map(a=>a.z).join("，而且")}。`);
  else if(near.length) line=B(`After a whole year in ${info.n.e}, ${near[0].e}. So close.`,`在${info.n.z}待了一整年，${near[0].z}。就差那麼一點。`);
  else line=B(`After a whole year in ${info.n.e}, ${info.noAch.e}.`,`在${info.n.z}待了一整年，${info.noAch.z}。`);
  L.clubAch=[]; L.clubNear=[];
  const opts=[];
  if(info) opts.push(O(`Carry on with ${info.n.e}`,`繼續待在${info.n.z}`,()=>{ L.clubYears=(L.clubYears||1)+1; say(`You decide to stay with ${info.n.e} for another year.`,`你決定在${info.n.z}再待一年。`); },`Year ${(L.clubYears||1)+1} in the club`,`社團第 ${(L.clubYears||1)+1} 年`));
  opts.push(O("Switch to a different club","換一個社團",()=>clubChoice(n,false)));
  if(c!=="quidditch") opts.push(O("Try out for the house Quidditch team","參加學院魁地奇隊選拔",()=>tryout()));
  opts.push(O(n>=5?"Take a break from clubs to focus on exams":"Take a break from clubs",n>=5?"暫停社團，專心準備考試":"暫停社團活動",()=>{ L.club="none"; L.clubYears=0; if(n>=5) mod("magic",3); say(n>=5?"You give up clubs this year to revise.":"You take a year off from clubs.",n>=5?"你今年放棄社團，專心複習。":"你今年暫停社團活動。"); }));
  ask(K(),B("A new school year","新學年"),B(`${line.e} This year, you decide to…`,`${line.z}今年，你決定……`),opts);
}
function tryout(){
  if(chance(0.3+L.stats.health/250+(L.clubYears&&L.club==="quidditch"?0.2:0))){ L.club="quidditch"; L.clubYears=1; const pos=pick([B("Chaser","追蹤手"),B("Beater","打擊手"),B("Keeper","看守手"),B("Seeker","搜捕手")]); say(`You make the house team as ${pos.e}!`,`你入選學院代表隊，擔任${pos.z}!`,"major good"); mod("happy",6); }
  else { L.club="none"; L.clubYears=0; say("You don't make the house team this year.","你今年沒有入選學院代表隊。","bad"); mod("happy",-4); }
}
function clubChoice(n,intro){
  const opts=CLUBS.filter(c=>!(c.min&&n<c.min)&&c.k!==L.club).map(c=>({label:c.l,sub:c.s,go:()=>{
    if(c.k==="quidditch") tryout();
    else { L.club=c.k; L.clubYears=c.k==="none"?0:1; if(c.k!=="none") say(`You join ${CLUB_INFO[c.k].n.e}.`,`你加入了${CLUB_INFO[c.k].n.z}。`,"good"); }
  }}));
  ask(K(),B(intro?"Clubs at Hogwarts":"Choose a new club",intro?"霍格華茲的社團":"選擇新社團"),intro?CLUB_INTRO:B("The clubs are recruiting in the Great Hall again.","各社團又在餐廳裡招生了。"),opts);
}
function clubSignature(){
  const c=L.club, info=CLUB_INFO[c]; if(!info) return;
  const yrs=L.clubYears||1, s=info.sig[Math.min(yrs,info.sig.length)-1];
  sayB(s,"good"); mod("happy",3); if(c==="duel"||c==="astro"||c==="chess") mod("magic",2); if(c==="quidditch") mod("health",2); if(c==="gob"||c==="choir") mod("friends",2);
}

// option with a Galleon cost: disabled if you can't afford it
function OC(le,lz,cost,go,se,sz){ const broke=L.stats.gold<cost; return {label:B(le,lz),sub:B(`${cost?`−${cost} Galleons`:"Free"}${se?` · ${se}`:""}${broke?" · can't afford":""}`,`${cost?`−${cost} 金加隆`:"免費"}${sz?` · ${sz}`:""}${broke?" · 付不起":""}`),disabled:broke,go:()=>{ mod("gold",-cost); go(); }}; }
const fn1=p=>B(p.name.e.split(" ")[0],p.name.z.split("·")[0]);
const muggleCare=()=>!L.magical||L.squibMuggle;
const nhs=()=>muggleCare()&&Y()>=1948;
// three-way moment helper: [good, neutral, bad] options shuffled; each [le,lz,re,rz,costOrNull]
function triple(title,text,p,opts){
  const d=[10,0,-12];
  ask(K(),title,text,shuffle(opts.map((o,i)=>{ const go=()=>{ if(p) bump(p,d[i]+rint(-2,2)); say(o[2],o[3],i===0?"good":i===2?"bad":""); if(i===0) mod("happy",2); if(i===2) mod("happy",-2); };
    return o[4]?OC(o[0],o[1],o[4],go):O(o[0],o[1],go); })));
}

// ---------- proposing ----------
function proposeQuestion(p){
  const f=fn1(p), yrs=Y()-L.dateStart;
  ask(K(),B("Is it time to propose?","是時候求婚了嗎？"),B(`You and ${f.e} have been together ${yrs} years and been on ${p.dates} memorable dates. Is it time?`,`你和${f.z}已經交往 ${yrs} 年，有過 ${p.dates} 次難忘的約會。是時候了嗎？`),[
    O("Propose","求婚",()=>{ if(chance(clamp(p.close/100+0.25,0,0.97))){ say(`You propose to ${f.e}. They say yes!`,`你向${f.z}求婚，對方答應了！`,"major good"); notice(B(`Engagements: ${L.name.e} and ${p.name.e}.`,`訂婚：${L.name.z}與${p.name.z}。`)); weddingChoice(p); } else { bump(p,-10); say(`${f.e} says they aren't ready yet.`,`${f.z}說還沒準備好。`,"bad"); } },`About ${Math.round(clamp(p.close/100+0.25,0,0.97)*100)}% chance of a yes`,`答應的機率約 ${Math.round(clamp(p.close/100+0.25,0,0.97)*100)}%`),
    O("Not yet","還不是時候",()=>{ say("You decide to wait a little longer.","你決定再等等。"); }, yrs>=4?`${f.e} may not wait forever`:"",yrs>=4?`${f.z}可能不會永遠等下去`:""),
    O("End the relationship","結束這段關係",()=>{ p.role="ex"; p.kin=B("Ex","前任"); mod("happy",-6); say(`You end things with ${f.e}.`,`你和${f.z}分手了。`,"major bad"); }) ]);
}
function ultimatum(p){
  const f=fn1(p), yrs=Y()-L.dateStart;
  ask(K(),B(`${f.e} wants to talk`,`${f.z}想談談`),B(`After ${yrs} years, ${f.e} asks you straight out: 'Where is this going?'`,`交往 ${yrs} 年後，${f.z}直截了當地問你：「我們到底要走向哪裡？」`),[
    O("Propose, right now","現在就求婚",()=>{ say(`You propose on the spot. ${f.e} laughs, cries and says yes.`,`你當場求婚。${f.z}又哭又笑地答應了。`,"major good"); notice(B(`Engagements: ${L.name.e} and ${p.name.e}.`,`訂婚：${L.name.z}與${p.name.z}。`)); weddingChoice(p); }),
    O("Ask for one more year","請對方再給一年",()=>{ if(chance(0.4)){ p.role="ex"; p.kin=B("Ex","前任"); mod("happy",-10); say(`${f.e} has waited long enough. They leave.`,`${f.z}已經等夠久了。對方離開了你。`,"major bad"); } else { p.lastChance=Y()+1; bump(p,-8); say(`${f.e} agrees, but you can tell it's the last time.`,`${f.z}答應了，但你看得出這是最後一次。`,"bad"); } },"40% chance they leave now","40% 機率對方現在就離開"),
    O("Admit you don't want to marry","承認你不想結婚",()=>{ p.role="ex"; p.kin=B("Ex","前任"); mod("happy",-6); say(`You tell ${f.e} the truth. You part as kindly as you can.`,`你對${f.z}說了實話。你們盡可能溫和地分開。`,"major bad"); }) ]);
}
function weddingChoice(p){
  const f=fn1(p);
  const marry=(e,z)=>{ p.role="partner"; p.kin=B("Spouse","配偶"); bump(p,10); L.married=true; L.partner=p.name; L.weddingYear=Y(); say(e,z,"major good"); mod("happy",10); notice(B(`Weddings: ${L.name.e} and ${p.name.e}.`,`婚訊：${L.name.z}與${p.name.z}。`)); };
  ask(K(),B("Planning the wedding","籌備婚禮"),B(`What kind of wedding do you and ${f.e} want?`,`你和${f.z}想要什麼樣的婚禮？`),[
    OC("A big wedding with everyone you know","邀請所有親友的盛大婚禮",15,()=>{ marry(`You marry ${p.name.e} in a marquee full of floating candles. Everyone you love is there.`,`你和${p.name.z}在滿是飄浮蠟燭的大帳篷裡結婚。你愛的人都到場了。`); mod("friends",10); parents().forEach(q=>bump(q,6)); }),
    OC("A small ceremony with close family","只邀近親的小型婚禮",5,()=>{ marry(`You marry ${p.name.e} in a small ceremony. It's perfect.`,`你和${p.name.z}舉行了一場小型婚禮。完美極了。`); parents().forEach(q=>bump(q,3)); }),
    OC("Elope","私奔",0,()=>{ marry(`You and ${p.name.e} elope to Gretna Green. Your families are not amused.`,`你和${p.name.z}私奔到格雷特納格林結婚。雙方家人都不太高興。`); mod("happy",4); parents().forEach(q=>bump(q,-8)); }) ]);
}
function datingYear(p){
  const a=L.age, yrs=Y()-(L.dateStart||Y()); p.dates=p.dates||0;
  if(p.lastChance&&Y()>=p.lastChance){ p.role="ex"; p.kin=B("Ex","前任"); mod("happy",-10); say(`${p.name.e} leaves. They gave you every chance to propose.`,`${p.name.z}離開了。對方已經給過你所有求婚的機會。`,"major bad"); return; }
  if(a>=18&&yrs>=7&&p.close>=40){ p.role="ex"; p.kin=B("Ex","前任"); mod("happy",-10); say(`After ${yrs} years without a proposal, ${p.name.e} leaves you.`,`交往 ${yrs} 年都沒等到求婚，${p.name.z}離開了你。`,"major bad"); return; }
  if(a>=18&&yrs>=5&&!p.lastChance&&chance(0.55)){ ultimatum(p); return; }
  if(a>=18&&yrs>=2&&p.dates>=3&&p.close>=55&&chance(0.65)){ if(p.close>=72&&chance(0.25)) proposal(p); else proposeQuestion(p); return; }
  moment(p); if(chance(0.35)) moment(p);
}

    OC("Start over somewhere smaller","搬到小一點的地方重新開始",0,()=>{ L.home=false; say("You start again in a small rented flat.","你在一間小小的租屋裡重新開始。","major bad"); mod("happy",-6); })];

function kidsYear(){

  const young=ks.filter(k=>kAge(k)<18);
  if(!chance(young.length?0.5:0.25)) return;
  const k=pick(young.length?young:ks);
  const pool=KID_EVENTS.filter((e,i)=>e.w(k)>0&&(i===0?(k.sick||0)<2:!(k.ev||[]).includes(i))); if(!pool.length) return;
  const e=weighted(pool,e=>e.w(k)), ei=KID_EVENTS.indexOf(e); if(ei===0) k.sick=(k.sick||0)+1; else k.ev=(k.ev||[]).concat(ei); e.go(k);

function curriculum(n){
  if(n===1) return CORE.concat(["flying"]);

  if(n<=5) return CORE.concat(ELECTIVES);
  // N.E.W.T. years: only subjects passed at O.W.L. with a high enough grade
  return CORE.concat(ELECTIVES).filter(k=>{ const g=(L.owl||{})[k]; if(!g) return false; const snape=k==="potions"&&Y()>=1981&&Y()<=1995&&L.schoolStart+5<=1995; return snape?g==="O":(g==="O"||g==="E"); });

function autoTimetable(n){
  const cur=curriculum(n); const pick6=[];
  const prefer=n>=6?cur.slice().sort((a,b)=>"OEAPDT".indexOf(L.owl[a])-"OEAPDT".indexOf(L.owl[b])):cur.filter(k=>CORE.includes(k)||k==="flying").concat(cur.filter(k=>ELECTIVES.includes(k)).sort((a,b)=>(L.talent[b]||0)-(L.talent[a]||0)));
  for(const k of prefer){ if(pick6.length<6) pick6.push(k); }
  while(pick6.length<6) pick6.push("");
  if(n>=4&&n<=5){ // make sure two electives fit: drop History of Magic first, then Herbology
    const el=pick6.filter(k=>ELECTIVES.includes(k)).length;
    if(el<2){ const add=cur.filter(k=>ELECTIVES.includes(k)&&!pick6.includes(k)).sort((a,b)=>(L.talent[b]||0)-(L.talent[a]||0)); for(const drop of ["history","herbology"]){ if(pick6.filter(k=>ELECTIVES.includes(k)).length>=2) break; const i=pick6.indexOf(drop); if(i>=0&&add.length) pick6[i]=add.shift(); } }
  }
  return {slots:pick6,astro:true,appar:false};
}

function renderTimetable(box){
  const st=currentModal.options.state, n=st.n, cur=curriculum(n);
  const opt=(sel)=>`<option value="">${tx(B("— Free period (skip) —","— 空堂(翹課)—"))}</option>`+cur.map(k=>`<option value="${k}" ${sel===k?"selected":""}>${tx(cn(k))}${ELECTIVES.includes(k)?tx(B(" (elective)","(選修)")):""}${n>=6&&L.owl&&L.owl[k]?` · O.W.L. ${L.owl[k]}`:""}</option>`).join("");
  box.innerHTML=`<div class="tt">
    ${SLOT_B.map((s,i)=>`${i===4?`<div class="ttbreak">${tx(B("Lunch in the Great Hall · break","餐廳午餐 · 休息"))}</div>`:""}<label class="ttrow"><span>${tx(s)}</span><select id="tt${i}">${opt(st.slots[i])}</select></label>`).join("")}
    <div class="ttbreak">${tx(B("Dinner · evening in the common room","晚餐 · 晚上在交誼廳"))}</div>
    <label class="ttrow ttcheck"><span>${tx(B("Midnight: Astronomy","午夜：天文學"))}</span><input type="checkbox" id="ttastro" ${st.astro?"checked":""}></label>
    ${n===6?`<label class="ttrow ttcheck"><span>${tx(B("Apparition lessons (−12 Galleons)","現影術課程(−12 金加隆)"))}</span><input type="checkbox" id="ttapp" ${st.appar?"checked":""} ${L.stats.gold<12?"disabled":""}></label>`:""}
    ${st.err?`<p class="tterr">${tx(st.err)}</p>`:""}
    <div class="ttbtns"><button class="opt" id="ttauto">${tx(B("Suggest a timetable","建議課表"))}</button><button class="btn" id="ttok">${tx(B("Confirm timetable","確認課表"))}</button></div></div>`;
  const read=()=>{ st.slots=[0,1,2,3,4,5].map(i=>$("tt"+i).value); st.astro=$("ttastro").checked; st.appar=!!($("ttapp")&&$("ttapp").checked); };
  box.querySelectorAll("select,input").forEach(el=>el.onchange=read);
  $("ttauto").onclick=()=>{ const a=autoTimetable(n); st.slots=a.slots; st.err=null; renderTimetable(box); };
  $("ttok").onclick=()=>{ read(); const chosen=st.slots.filter(Boolean);
    if(new Set(chosen).size!==chosen.length){ st.err=B("Each subject can only go in one period.","每個科目只能排在一個時段。"); return renderTimetable(box); }
    if(n>=4&&n<=5&&chosen.filter(k=>ELECTIVES.includes(k)).length<2){ st.err=B("Choose at least two electives.","至少要選兩門選修課。"); return renderTimetable(box); }
    choose({go:()=>applyTimetable(st)}); };
}
function applyTimetable(st){
  const n=st.n, chosen=st.slots.filter(Boolean);
  L.tt={y:Y(),n,slots:st.slots.slice(),astro:st.astro}; L.skips={};
  const names=chosen.map(k=>cn(k));
  say(`Your year ${n} timetable: ${names.map(x=>x.e).join(", ")||"nothing at all"}${st.astro?", and Astronomy at midnight":""}.`,`你的 ${n} 年級課表：${names.map(x=>x.z).join("、")||"什麼都沒排"}${st.astro?"，還有午夜的天文學":""}。`);
  const dropped=n<=5?CORE.filter(k=>!chosen.includes(k)).concat(st.astro?[]:["astronomy"]):[];
  if(dropped.length){ say(`Your Head of House notices you've dropped ${dropped.map(k=>cn(k).e).join(", ")} and sends a very stern note.`,`學院導師發現你沒排${dropped.map(k=>cn(k).z).join("、")}，寄來一張非常嚴厲的紙條。`,"bad"); L.stats.rep=clamp(L.stats.rep-2*dropped.length); if(L.hpLive&&L.house) L.hpLive[L.house]-=10*dropped.length; }
  if(chance(0.7)) skipTemptation();
  if(st.appar&&n===6&&L.stats.gold>=12){ mod("gold",-12); L.appar=true; say("You sign up for Apparition lessons with the Ministry instructor.","你報名了魔法部講師的現影術課程。"); }
}
// tempted to skip during the year
function skipTemptation(){
  if(!L.tt||!atSchool()) return;
  const taken=L.tt.slots.filter(Boolean); if(!taken.length) return;
  const k=pick(taken), c=cn(k);
  const why=pick([B("It's pouring with rain and your bed is very warm.","外面下著傾盆大雨，你的被窩好溫暖。"),B("Your friends are going down to the lake instead.","你的朋友們要翹課去湖邊。"),B("You haven't done the homework.","你還沒寫作業。")]);
  ask(K(),B(`Skip ${c.e}?`,`翹掉${c.z}?`),B(`${why.e} You could just not go to ${c.e} today.`,`${why.z}你今天大可不去上${c.z}。`),[
    O("Go to the lesson","去上課",()=>{ L.skips[k]=(L.skips[k]||0)-1; say(`You drag yourself to ${c.e}. You're glad you did.`,`你硬撐著去上${c.z}。幸好有去。`); }),
    O("Skip it","翹課",()=>{ L.skips[k]=(L.skips[k]||0)+1; mod("happy",2); if(chance(0.3)){ say(`You skip ${c.e} and get caught. Detention.`,`你翹了${c.z}，結果被抓到。勞動服務。`,"bad"); } else say(`You skip ${c.e}. Nobody notices, this time.`,`你翹了${c.z}。這次沒人發現。`); },"Lower marks in this subject","這科成績會下降") ]);
}
function prefectCheck(){
  L.prefectAsked=true;
  const avg=L.lastExam?L.lastExam.avg:50;
  if(chance(clamp((avg-58)/80+(L.stats.rep-40)/250,0.02,0.4))){ L.prefect=true; L.stats.rep=clamp(L.stats.rep+5); say("Your Hogwarts letter contains a prefect's badge. The Headmaster has chosen you as a prefect.","你的霍格華茲來信裡附了一枚級長徽章。校長選你當級長。","major good"); notice(B(`Hogwarts: ${L.name.e} appointed prefect of ${L.house}.`,`霍格華茲：${L.name.z}獲任命為${HZ[L.house]}級長。`)); }
}
function headCheck(){

  if(chance(L.prefect?clamp((avg-62)/120+0.08,0.03,0.3):0.01)){ L.head=true; L.stats.rep=clamp(L.stats.rep+8); const t=L.gender==="m"?B("Head Boy","男學生主席"):B("Head Girl","女學生主席"); say(L.prefect?`You're made ${t.e} of Hogwarts.`:`To everyone's astonishment, including yours, you're made ${t.e} without ever having been a prefect.`,L.prefect?`你被任命為霍格華茲${t.z}。`:`你從沒當過級長，卻被任命為${t.z}，所有人都大吃一驚，包括你自己。`,"major good"); notice(B(`Hogwarts: ${L.name.e} named ${t.e}.`,`霍格華茲：${L.name.z}獲任命為${t.z}。`)); }

// end of each school year: exams (computed at the start of the next game year)
function examFinish(){
  const tt=L.tt; if(!tt||tt.done) return; tt.done=true;
  const n=tt.n, courses=tt.slots.filter(Boolean).concat(tt.astro?["astronomy"]:[]);
  const res={};
  for(const k of courses){
    const base=56+(L.stats.magic-(10+8*n))*0.8+(L.talent[k]||0)+((L.bookAdj||{})[k]||0)+(L.focus==="study"?8:0)+rint(-12,12)-(L.skips[k]||0)*12+(L.club==="astro"&&k==="astronomy"?8:0)+(L.club==="duel"&&k==="dada"?6:0)+(L.club==="quidditch"&&k==="flying"?10:0);
    L.grades=L.grades||{}; L.grades[k]=clamp(base); res[k]=letter(L.grades[k]);
  }
  const vals=courses.map(k=>L.grades[k]); const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0; const ov=letter(avg);
  L.lastExam={n,res,avg,ov,y:tt.y}; L.bookAdj={};
  const list=courses.map(k=>B(`${cn(k).e}: ${res[k]}`,`${cn(k).z}：${res[k]}`));
  const kind=n===5?B("O.W.L.","普等巫測"):n===7?B("N.E.W.T.","超勞巫測"):B("end-of-year exam","期末考");
  if(n===5){ L.owl=res; const p=courses.filter(k=>passed(res[k])).length; say(`Your O.W.L. results arrive by owl. You pass ${p} of ${courses.length}: ${list.map(x=>x.e).join(", ")}.`,`普等巫測成績由貓頭鷹送達。你通過了 ${courses.length} 科中的 ${p} 科：${list.map(x=>x.z).join("、")}。`,"major "+(p>=7?"good":p>=4?"":"bad")); }
  else if(n===7){ L.newt=res; const p=courses.filter(k=>passed(res[k])).length; L.newts=p; say(p?`Your N.E.W.T. results arrive. You pass ${p}: ${list.map(x=>x.e).join(", ")}.`:"Your N.E.W.T. results arrive. You haven't passed any.",p?`超勞巫測成績寄到了。你通過了 ${p} 科：${list.map(x=>x.z).join("、")}。`:"超勞巫測成績寄到了。你一科都沒過。","major "+(p>=4?"good":p?"":"bad")); }
  else say(`Your ${kind.e} results: ${list.map(x=>x.e).join(", ")}. Overall: ${GRADE_B[ov].e}.`,`你的${kind.z}成績：${list.map(x=>x.z).join("、")}。總評：${GRADE_B[ov].z}。`,ov==="O"||ov==="E"?"good":ov==="D"||ov==="T"?"bad":"");
  const fx={O:[5,4,4],E:[3,2,2],A:[1,0,0],P:[0,-1,-2],D:[-1,-3,-4],T:[-2,-4,-5]}[ov];
  mod("magic",fx[0]*(n===5||n===7?1.5:1)); L.stats.rep=clamp(L.stats.rep+fx[1]*(n===5||n===7?1.5:1)); mod("happy",fx[2]);
  if(parents().length&&(ov==="O"||ov==="E")){ parents().forEach(p=>bump(p,3)); }
  if(n===6&&L.appar&&L.age>=17){ if(chance(clamp(0.45+L.stats.magic/200,0.3,0.95))){ L.apparLicence=true; say("You pass your Apparition test. You can now vanish and reappear wherever you like.","你通過了現影術考試。現在你可以隨心所欲地消失、現身了。","good"); } else say("You fail your Apparition test, leaving half an eyebrow behind.","你的現影術考試沒過，還留下了半邊眉毛。","bad"); }
}

function reqMet(k){
  const r=CAREER_REQ[k], nw=L.newt||{}, ok=g=>g&&"OEA".indexOf(g)>=0&&"OEA".indexOf(g)<="OEA".indexOf(r.min);
  const pool=r.subs===null?Object.keys(nw):r.subs;
  const have=pool.filter(s=>ok(nw[s])).length;
  return {have:Math.min(have,r.need),need:r.need};
}
function careerChoice(){
  ask(K(),B("Life after Hogwarts","霍格華茲之後"),B("You've left school. Your N.E.W.T. results decide which doors are open. What do you want to do?","你畢業了。超勞巫測成績決定了哪些門為你敞開。你想做什麼？"),CAREERS.map(c=>{ const r=CAREER_REQ[c.k], m=reqMet(c.k);
    const sub=B(`${r.d.e}${r.need?` · you have ${m.have}/${m.need}`:""}`,`${r.d.z}${r.need?` · 你符合 ${m.have}/${m.need}`:""}`);

      let p= c.k==="Quidditch player"?clamp(0.08+(L.club==="quidditch"?0.3:0)+((L.grades||{}).flying||40)/400+L.stats.health/700,0,0.8)
        : !r.need?0.95 : m.have>=m.need?0.9 : m.have>=m.need-1?0.3 : 0.05;
      if(r.need) p=clamp(p+networkBonus(),0.02,0.97);
      if(chance(p)){ setCareer(c.k,c.inc); const t=jobTitle(); say(`You start out as ${an(t.e)} ${t.e}.`,`你從${t.z}做起。`,"major good"); if(c.k==="Diagon Alley shopkeeper") mod("gold",-10); }

function workCat(){ const c=L.career||""; if(!L.magical) return "muggle"; if(/curse-breaker/.test(c)) return "breaker"; if(c==="Magizoologist") return "zoo"; if(/Prophet/.test(c)) return "press"; if(/barman|waiter|cleaner|Leaky|Three Broomsticks/.test(c)) return "service"; if(/Ministry/.test(c)) return "ministry"; if(c==="Auror") return "auror"; if(/Healer|nurse/.test(c)) return "healer"; if(/Quidditch/.test(c)) return "sport"; if(/shop|Flourish|Broom shop|shop assistant/.test(c)) return "shop"; if(/professor|teacher/.test(c)) return "teacher"; return null; }
function workEvent(){
  const cat=workCat(), pool=(WORK_BY[cat]||[]).concat(WORK_GENERIC).filter(e=>!L.used.has(e));
  if(!pool.length){ jobFlavor(); return; } const e=(cat&&WORK_BY[cat].some(x=>!L.used.has(x))&&chance(0.65))?pick(WORK_BY[cat].filter(x=>!L.used.has(x))):pick(pool); L.used.add(e);
  ask(K(),e.t,e.x,shuffle(e.o.map(o=>O(o[0],o[1],()=>{ for(const k in o[2]){ if(k==="income") L.income=Math.max(1,L.income+o[2][k]); else if(k==="rep") L.stats.rep=clamp(L.stats.rep+o[2][k]); else mod(k,o[2][k]); } say(o[3],o[4]); }))));
}
function retireAsk(){
  const forced=L.age>=(L.magical?110:75);
  if(forced){ retire(); return; }
  ask(K(),B("Is it time to retire?","是時候退休了嗎？"),B(`You're ${L.age}, and you've been working for ${L.jobYears||0} years as ${jobTitle().e}.`,`你 ${L.age} 歲了。你當${jobTitle().z}已經 ${L.jobYears||0} 年。`),[
    O("Yes, retire","是的，退休",()=>{ retire(); say("Your colleagues throw you a farewell party and give you a carriage clock.","同事們為你辦了歡送會，還送你一座座鐘。","good"); }),
    O("Not yet, keep working","還不要，繼續工作",()=>say("You decide you're not ready to stop yet.","你決定還沒準備好停下來。")) ]);
}

function forestRescue(){

}
function forestDanger(){

}

function forestCaught(p){
  if(!L.alive||!atSchool()||!chance(p)) return;

}
function forestEncounter(deep){
  const pool=FOREST.filter(f=>deep||!["acromantula","centaur"].includes(f.k)), e=weighted(pool,f=>f.w()*(deep&&["unicorn","thestral","acromantula","centaur"].includes(f.k)?1.6:1));
  ask(K(),e.t,e.x,e.o.map(o=>O(o[0],o[1],()=>{ o[2](); forestCaught(deep?0.35:0.2); },o[3]?o[3]:null,o[4]?o[4]:null)));
}

function pocketMoney(){

// will your family pay? depends on money and how close you are
function familyPays(cost){
  const ps=parents(); if(!ps.length) return {ok:false,why:B("You have no parents to ask.","你沒有父母可以求助。")};
  const best=ps.slice().sort((a,b)=>b.close-a.close)[0];
  if(L.fclass==="poor") return {ok:false,p:best,why:B(`Your ${kinL(best).e} writes back, sorry: there's simply no money this month.`,`你的${kinL(best).z}回信道歉：這個月真的沒錢了。`)};
  if(best.close<30) return {ok:false,p:best,why:B(`Your ${kinL(best).e} replies coldly that you should be more careful with your things.`,`你的${kinL(best).z}冷冷地回信，說你應該更小心自己的東西。`)};
  if(L.fclass==="middle"&&cost>6) return {ok:chance(0.5),p:best,why:B(`Your ${kinL(best).e} says it's too expensive this time.`,`你的${kinL(best).z}說這次太貴了。`)};
  return {ok:true,p:best};
}

function schoolShopping(n){
  const list=n===1?B("robes, a cauldron, scales, a wand, and a long list of books","長袍、坩堝、天秤、魔杖，還有一長串書單"):n===4?B("new books for your electives and bigger robes","選修課的新課本和大一號的長袍"):B("advanced N.E.W.T. textbooks","進階的超勞巫測課本");
  const cost=n===1?8:6;
  const opts=[];
  if(L.fclass==="noble"||L.fclass==="wealthy") opts.push(O("Your parents buy everything new","父母幫你全部買新的",()=>{ parents().forEach(p=>bump(p,2)); say(L.fclass==="noble"?"Your parents buy everything new, including dragon-hide gloves monogrammed with the family crest.":"Your parents buy everything new from Diagon Alley.",L.fclass==="noble"?"父母幫你全部買新的，連龍皮手套都繡上了家徽。":"父母在斜角巷幫你全部買新的。","good"); }));
  else opts.push(O("Ask your parents to buy new things","請父母買新的",()=>{ const r=familyPays(cost); if(r.ok){ say("Your parents scrape together enough for new things. You notice how carefully they count the coins.","父母東拼西湊，幫你買了新東西。你注意到他們數錢數得很仔細。"); if(r.p) bump(r.p,4); } else { sayB(r.why); L.shBooks=true; say("You make do with second-hand everything.","你只好全部用二手的。"); } }));
  opts.push(OC("Pay for some new things yourself","自己出錢買一些新的",Math.ceil(cost/2),()=>say("You pay for part of the list yourself, and feel very grown-up.","你自己付了一部分，覺得自己很像大人。")));
  opts.push(OC("Second-hand everything","全部買二手的",0,()=>{ L.shBooks=true; say(`Your ${list.e} all come second-hand. Your books are full of someone else's notes in the margins.`,`你的${list.z}全是二手的。書頁邊緣寫滿了別人的筆記。`); if(chance(0.3)){ mod("magic",2); say("Some of the scribbled notes are surprisingly helpful.","有些潦草的筆記出奇地有用。","good"); } }));
  ask(K(),B("School shopping","採買學用品"),B(`This year you need ${list.e}.`,`今年你需要${list.z}。`),opts);
}

function orderYear(){
  if(L.side!=="order"||L.azkaban||!L.alive) return;
  if(atWar()&&L.age>=17){ if(Y()>=1995) L.fought95=true; if(chance(0.6)){ const m=ORDER_MISSIONS.filter(x=>!L.used.has(x)); if(m.length){ const e=pick(m); L.used.add(e); ask(K(),e.t,e.x,e.o.map(o=>O(o[0],o[1],o[2],o[3]||null,o[4]||null))); } } return; }
  if(chance(0.35)){ const pool=ORDER_AFTER.filter(x=>!L.used.has(x)&&x.w()); if(pool.length){ const e=pick(pool); L.used.add(e); ask(K(),e.t,e.x,e.o.map(o=>O(o[0],o[1],o[2]))); } }
}

// ================= TRAITS & PIXEL PORTRAIT =================
const TRAITS={brave:B("brave","勇敢"),shy:B("shy","害羞"),curious:B("curious","好奇"),clumsy:B("clumsy","笨手笨腳"),ambitious:B("ambitious","有野心"),kind:B("kind","善良"),mischievous:B("mischievous","調皮"),bookish:B("bookish","愛讀書")};
const TRAIT_HOUSE={brave:"Gryffindor",ambitious:"Slytherin",curious:"Ravenclaw",bookish:"Ravenclaw",kind:"Hufflepuff",mischievous:"Gryffindor"};
const SKIN=[["#f6d7c3","#e4b9a0"],["#eac09a","#d4a17a"],["#c98e62","#b07448"],["#9a6440","#7f4f30"],["#6b4429","#55341f"]];
const HAIR=[{c:"#1d1714",b:B("black","黑")},{c:"#5a3a22",b:B("brown","棕")},{c:"#a8742f",b:B("light brown","淺棕")},{c:"#e1c16e",b:B("blonde","金")},{c:"#b5471f",b:B("red","紅")},{c:"#7a2e1c",b:B("auburn","赤褐")}];
const EYES=[{c:"#3b2a1e",b:B("brown","棕色")},{c:"#3a6fb0",b:B("blue","藍色")},{c:"#3f8a4a",b:B("green","綠色")},{c:"#6f7b84",b:B("grey","灰色")},{c:"#8a6a2f",b:B("hazel","淡褐色")}];
const STYLES=[{k:"short",b:B("short","短")},{k:"long",b:B("long","長")},{k:"curly",b:B("curly","捲")},{k:"messy",b:B("messy","亂翹的")}];
function makeLook(){
  const skin=rint(0,SKIN.length-1), hair=weighted(HAIR.map((h,i)=>i),i=>[3,4,2,2,1,1][i]), eyes=rint(0,EYES.length-1);
  const style=L.gender==="f"?weighted([0,1,2,3],i=>[1,4,2,1][i]):weighted([0,1,2,3],i=>[5,1,2,2][i]);
  return {skin,hair,eyes,style,glasses:chance(0.18),freckles:chance(hair>=4?0.6:0.15),beard:L.gender==="m"&&chance(0.35)};
}
function stageOf(){ const a=L.age; if(a<3) return "baby"; if(a<11) return "child"; if(atSchool()||a<18) return "student"; if(a<(L.magical?90:62)) return "adult"; return "elder"; }
const STAGE_B={baby:B("Baby","嬰兒"),child:B("Child","孩童"),student:B("Student","學生"),adult:B("Adult","成年"),elder:B("Elder","年長")};
function drawPortrait(cv){
  if(!cv||!L.look) return; const x=cv.getContext("2d"); x.clearRect(0,0,16,16);
  const lk=L.look, st=stageOf(), sk=SKIN[lk.skin], P=(c,px,py,w=1,h=1)=>{ x.fillStyle=c; x.fillRect(px,py,w,h); };
  const old=st==="elder", hairC=old?(L.age>(L.magical?110:75)?"#eeeeee":"#a9a9a9"):HAIR[lk.hair].c, eye=EYES[lk.eyes].c;
  const robe=st==="baby"?"#f2e6c9":st==="student"&&L.house?{Gryffindor:"#a3302a",Slytherin:"#2f7a52",Ravenclaw:"#36589e",Hufflepuff:"#c99a26"}[L.house]:L.magical?"#2b2b3a":"#5d6d7e";
  if(st==="baby"){ // round head, tiny tuft, blanket
    P(robe,3,11,10,5); P(sk[0],5,4,6,7); P(sk[0],4,5,8,5); P(hairC,7,3,2,1); P(sk[1],5,10,6,1);
    P(eye,6,7); P(eye,9,7); P("#d07a7a",7,9,2,1); return; }
  const small=st==="child", top=small?4:2, h=small?8:9;
  // body / robes
  P(robe,3,13,10,3); P(robe,4,12,8,1); if(st==="student"){ P("#e8e8e8",7,12,2,2); P(robe==="#c99a26"?"#1d1714":"#d9b44a",7,13,2,1); }
  if(!L.magical&&st!=="student") P("#e8e8e8",7,12,2,1);
  // long hair behind
  if(lk.style===1){ P(hairC,3,top+2,1,h); P(hairC,12,top+2,1,h); P(hairC,4,top+h-1,1,3); P(hairC,11,top+h-1,1,3); }
  // face
  P(sk[0],4,top+1,8,h-1); P(sk[0],5,top,6,1); P(sk[1],5,top+h-1,6,1); P(sk[1],4,top+h-2,1,1); P(sk[1],11,top+h-2,1,1);
  P(sk[1],3,top+4,1,2); P(sk[1],12,top+4,1,2); // ears
  // hair top
  P(hairC,4,top-1,8,2); P(hairC,3,top,1,3); P(hairC,12,top,1,3);
  if(lk.style===0) P(hairC,5,top+1,6,1);
  if(lk.style===2){ P(hairC,3,top-1,1,1); P(hairC,12,top-1,1,1); P(hairC,2,top+1,1,3); P(hairC,13,top+1,1,3); P(hairC,6,top+1,1,1); P(hairC,9,top+1,1,1); }
  if(lk.style===3){ P(hairC,5,top-2,1,1); P(hairC,8,top-2,1,1); P(hairC,10,top-2,1,1); P(hairC,4,top+1,3,1); P(hairC,9,top+1,2,1); }
  // eyes, glasses, mouth
  const ey=top+4; P(eye,6,ey); P(eye,9,ey); P("#ffffff",5,ey); P("#ffffff",10,ey);
  if(lk.glasses){ P("#1d1714",5,ey-1,3,1); P("#1d1714",8,ey-1,3,1); P("#1d1714",5,ey+1,3,1); P("#1d1714",8,ey+1,3,1); P("#1d1714",4,ey,1,1); P("#1d1714",11,ey,1,1); P("#1d1714",7,ey,2,1); }
  if(lk.freckles){ P(sk[1],5,ey+2); P(sk[1],10,ey+2); P(sk[1],6,ey+3); }
  P(sk[1],7,ey+2,2,1); // nose shadow
  P(old?"#8a5050":"#b5524f",7,ey+4,2,1);
  if(old){ P(sk[1],5,ey-2,2,1); P(sk[1],9,ey-2,2,1); P(sk[1],5,ey+4); P(sk[1],10,ey+4); }
  if(lk.beard&&(st==="adult"||old)){ P(hairC,5,ey+4,1,3); P(hairC,10,ey+4,1,3); P(hairC,6,ey+5,4,2); P(old?"#b5524f":"#b5524f",7,ey+4,2,1); }
}
function lookText(){
  const lk=L.look, st=stageOf(), old=st==="elder";
  if(st==="baby") return B(`A ${L.gender==="f"?"baby girl":"baby boy"} with a wisp of ${HAIR[lk.hair].b.e} hair and ${EYES[lk.eyes].b.e} eyes.`,`一個有著幾撮${HAIR[lk.hair].b.z}髮、${EYES[lk.eyes].b.z}眼睛的${L.gender==="f"?"女嬰":"男嬰"}。`);
  const hair=old?B(L.age>(L.magical?110:75)?"white":"grey",L.age>(L.magical?110:75)?"白":"灰白"):HAIR[lk.hair].b;
  const bits=[B(`${STYLES[lk.style].b.e} ${hair.e} hair`,`${STYLES[lk.style].b.z}${hair.z}髮`),B(`${EYES[lk.eyes].b.e} eyes`,`${EYES[lk.eyes].b.z}眼睛`)];
  if(lk.glasses) bits.push(B("glasses","戴眼鏡")); if(lk.freckles) bits.push(B("freckles","有雀斑")); if(lk.beard&&(st==="adult"||old)) bits.push(B("a beard","留著鬍子")); if(old) bits.push(B("laughter lines","有笑紋"));
  if(st==="student"&&L.house) bits.push(B(`${L.house} robes`,`${HZ[L.house]}長袍`));
  return B(bits.map(b=>b.e).join(", ").replace(/^./,c=>c.toUpperCase())+".",bits.map(b=>b.z).join("、")+"。");
}
function renderPortrait(){
  const box=$("gPortrait"); if(!box||!L.look) return;
  drawPortrait($("gPx"));
  $("gPxStage").textContent=tx(STAGE_B[stageOf()])+(L.trait?` · ${tx(TRAITS[L.trait])}`:"");
  $("gPxText").textContent=tx(lookText());
}

// ================= FAMILY NETWORK AT SCHOOL =================
function platformNetwork(){
  const magicHome=L.wizHome&&L.blood!=="muggle";
  if(L.blood==="muggle"){ say("You don't recognise a single face on the platform. Everyone else seems to know each other already.","月台上你一張熟面孔都沒有。其他人好像早就彼此認識了。"); mod("happy",-2); return; }
  const n=L.fclass==="noble"?rint(3,4):magicHome?rint(2,3):1;
  const names=[];
  for(let i=0;i<n;i++){ const nm=genName(chance(0.5)?"m":"f",L.by+rint(-1,1),L.blood==="pure"&&chance(0.6)); names.push(nm);
    addPerson({name:nm,role:"friend",close:rint(32,48),met:L.fclass==="noble"?B("pure-blood family gatherings","純種家族的聚會"):magicHome?B("your village","你們村子"):B("your parent's work friends","父母的同事聚會")}); }
  if(L.fclass==="noble"){ const c=genName(chance(0.5)?"m":"f",L.by-rint(2,4),true); addPerson({name:c,role:"friend",close:50,met:B("your family: an older cousin","家族：一位表親"),kin:B("Cousin","表親")}); names.push(c); }

function friendVisitOption(season){
  const f=friends().filter(p=>p.close>=50).sort((a,b)=>b.close-a.close)[0]; if(!f) return null;
  const fn=B(f.name.e.split(" ")[0],f.name.z.split("·")[0]);
  const lbl={xmas:B(`Spend Christmas at ${fn.e}'s house`,`去${fn.z}家過聖誕節`),easter:B(`Spend Easter at ${fn.e}'s house`,`去${fn.z}家過復活節`),summer:B(`Stay with ${fn.e} for two weeks`,`去${fn.z}家住兩個禮拜`)}[season];
  return {label:lbl,sub:B("Time with a close friend","和好友相處"),go:()=>{
    const n=L.visitN||0; L.visitN=n+1; const st=visitStage(n,fn);
    say(`You go to stay with ${f.name.e}'s family.`,`你去${f.name.z}家住。`);
    ask(K(),B(`At ${fn.e}'s house: ${st.t.e.toLowerCase()}`,`在${fn.z}家：${st.t.z}`),B(`What do you and ${fn.e} get up to this time?`,`這次你和${fn.z}要做什麼？`),st.o.map(a=>({label:a[0],go:()=>{ bump(f,a[1]+rint(-2,2)); for(const k in a[3]) mod(k,a[3][k]); parents().forEach(p=>bump(p,-1)); sayB(a[2],"good"); if(f.close>=80&&!f.bestSaid){ f.bestSaid=true; say(`${f.name.e} is your best friend now.`,`${f.name.z}現在是你最好的朋友了。`,"major good"); } }})));
  }};
}

  const v=EASTER_YR[n]; if(!v||L.used.has(v)) return; L.used.add(v);
  const opts=v.o.map(o=>({label:o[0],go:()=>{ for(const k in o[1]){ if(k==="moral") moral(o[1][k]); else if(k==="family") parents().forEach(p=>bump(p,o[1][k])); else if(k==="rep") L.stats.rep=clamp(L.stats.rep+o[1][k]); else mod(k,o[1][k]); } sayB(o[2]); }}));
  const fv=friendVisitOption("easter"); if(fv) opts.push(fv);
  ask(K(),B("Easter holidays","復活節假期"),v.x,opts);
}

   1998:()=>{ ask(K(),B("Rebuilding Hogwarts","重建霍格華茲"),B("The castle reopens in September, still scarred from the battle. Volunteers are needed to rebuild the towers.","城堡在九月重新開學，仍留著大戰的傷痕。需要志工幫忙重建高塔。"),[

 {x:B("The Great Hall is decorated with giant pumpkins and a thousand live bats swooping under the ceiling.","餐廳裡擺滿巨型南瓜，一千隻活蝙蝠在天花板下盤旋。"),o:[[B("Eat until you can't move","吃到動不了"),{happy:4,health:-1},B("Pumpkin pasties, treacle tart and toffee apples. You regret nothing.","南瓜餡餅、糖蜜餡餅和太妃糖蘋果。你毫不後悔。")],[B("Watch the ghosts' formation gliding display","看幽靈們的隊形滑行表演"),{happy:3},B("The ghosts glide through the walls in formation. One loses his head, literally.","幽靈們排成隊形穿牆而過。其中一位真的把頭弄掉了。")],[B("Slip out early to explore the castle","提早溜出去探索城堡"),{magic:1},B("You find a portrait that tells you a secret password. It doesn't work.","你遇到一幅肖像告訴你一個秘密口令。結果口令沒用。")]]},

function halloween(){
  const y=Y(); if(HALLOWEEN_SPECIAL[y]&&!L.used.has("hw"+y)){ L.used.add("hw"+y); return HALLOWEEN_SPECIAL[y](); }
  const v=schoolYear()===7?HALLOWEEN[4]:HALLOWEEN.slice(0,4).find(h=>!L.used.has(h)); if(!v||L.used.has(v)) return; L.used.add(v);
  ask(K(),B(`The Halloween feast, ${y}`,`${y} 年萬聖節宴會`),B(`${v.x.e} After the start-of-term feast, it's the school's second great feast of the year.`,`${v.x.z}這是繼開學宴會之後，學校一年中的第二場盛宴。`),v.o.map(o=>({label:o[0],go:()=>{ for(const k in o[1]){ if(k==="moral") moral(o[1][k]); else if(k==="rep") L.stats.rep=clamp(L.stats.rep+o[1][k]); else mod(k,o[1][k]); } sayB(o[2]); }})));
}

let ACH_ALL=[]; try{ ACH_ALL=JSON.parse(localStorage.getItem("wizLife_ach")||"[]"); }catch(e){ ACH_ALL=[]; }
function checkAch(){
  if(!L) return; L.ach=L.ach||[]; const fresh=[];
  for(const a of ACH){ if(L.ach.includes(a.id)) continue; let ok=false; try{ ok=a.c(); }catch(e){ ok=false; } if(ok){ L.ach.push(a.id); fresh.push(a); if(!ACH_ALL.includes(a.id)) ACH_ALL.push(a.id); } }
  if(!fresh.length) return;
  try{ localStorage.setItem("wizLife_ach",JSON.stringify(ACH_ALL)); }catch(e){}
  const last=L.log[L.log.length-1];
  if(last){ for(const x of fresh) last.lines.push({t:B(`Achievement unlocked: ${x.n.e}.`,`解鎖成就：${x.n.z}。`),cls:"ach"}); rerenderLog(); }
  for(const a of fresh) toast(B(`Achievement unlocked: ${a.n.e}`,`解鎖成就：${a.n.z}`),a.d);
}
function achLines(){ if(!L.achPending||!L.achPending.length) return; for(const id of L.achPending){ const a=ACH.find(x=>x.id===id); yearBuf.push({t:B(`Achievement unlocked: ${a.n.e}.`,`解鎖成就：${a.n.z}。`),cls:"ach"}); } L.achPending=[]; }
function toast(title,desc){
  const box=$("toasts"); if(!box) return;
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<b>${tx(title)}</b><span>${tx(desc)}</span>`; box.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),400); },3600);
}
function renderAchProfile(){
  const box=$("gAch"); if(!box) return; const got=(L.ach||[]).map(id=>ACH.find(a=>a.id===id));
  box.innerHTML=`<div class="sect">${tx(B(`Achievements (${got.length})`,`成就(${got.length})`))}</div>`+(got.length?`<div class="achs">${got.map(a=>`<span title="${tx(a.d)}">${tx(a.n)}</span>`).join("")}</div>`:`<p class="hpnote">${tx(B("None yet this life.","這輩子還沒有成就。"))}</p>`);
}
function renderAchStart(){
  const box=$("achStart"); if(!box) return;
  box.innerHTML=`<div class="sect">${tx(B(`Achievements across all your lives: ${ACH_ALL.length} of ${ACH.length}`,`你所有人生的成就：${ACH_ALL.length} / ${ACH.length}`))}</div>
   <div class="achgrid">${ACH.map(a=>{ const got=ACH_ALL.includes(a.id); return `<div class="achcard ${got?"got":""}"><b>${tx(a.n)}</b><small>${tx(a.d)}</small></div>`; }).join("")}</div>`;
}

function encounter(){
  if(L.age<11&&L.blood!=="squib") return;
  if(!chance(atSchool()?0.6:0.33)) return;
  const y=Y();
  const pool=ENC.filter(e=>e[1](y)>0&&!L.used.has(e));
  if(!pool.length) return;
  const e=weighted(pool,x=>x[1](y)*(L.met.has(x[0])?0.25:1)); L.used.add(e);
  const first=!L.met.has(e[0]); L.met.add(e[0]);
  const t=e[2]();
  if(t==="SLUG") return ask(K(),B("The Slug Club","鼻涕蟲社"),B("Professor Slughorn invites you to join his club of promising students. There will be crystallised pineapple.","史拉轟教授邀請你加入他的優秀學生俱樂部。會有蜜餞鳳梨。"),[
    O("Accept","接受",()=>{ say("You join the Slug Club. Slughorn introduces you to a famous Quidditch captain.","你加入了鼻涕蟲社。史拉轟介紹你認識一位知名魁地奇隊長。","meet good"); mod("friends",6); mod("gold",4); },"Useful friends for later","日後有用的人脈"),
    O("Decline","婉拒",()=>say("You decline. Slughorn looks wounded.","你婉拒了。史拉轟看起來很受傷。")) ]);
  if(t==="MYRTLE") return ask(K(),B("A girl crying in the bathroom","在廁所哭泣的女孩"),B("A gloomy Ravenclaw called Myrtle is crying in the girls' toilets on the second floor. Someone's been teasing her about her glasses.","一個名叫麥朵的陰鬱雷文克勞女生在二樓女廁裡哭。有人拿她的眼鏡取笑她。"),[
    O("Sit with her for a while","陪她坐一會兒",()=>{ say("You sit with Myrtle until she stops crying. She tells you she wishes she were dead, then laughs. Later, you'll remember this.","你陪著麥朵，直到她不哭了。她說她真希望自己死掉，然後笑了。後來，你會想起這一刻。","meet"); mod("friends",3); }),
    O("Leave her be","別打擾她",()=>say("You leave her alone. Later, you wish you hadn't.","你沒有理她。後來，你很後悔。","meet")) ]);
  if(t==="FLETCH") return ask(K(),B("A bargain","便宜貨"),B("Mundungus Fletcher offers you a silver goblet at a suspicious discount. It has someone else's family crest on it.","蒙當葛·弗列契用可疑的低價向你兜售一個銀酒杯，上面刻著別人家的家徽。"),[
    O("Buy it","買下",()=>{ mod("gold",-3); if(chance(0.4)){ say("The goblet turns out to be stolen from a pure-blood house. You get a stern visit from the Magical Law Enforcement Squad.","原來酒杯是從某個純種家族偷來的。魔法執法隊上門把你訓了一頓。","meet bad"); mod("happy",-5);} else say("You buy the goblet. It looks great on your mantelpiece.","你買下酒杯，擺在壁爐架上很好看。","meet"); }),
    O("Walk away","走開",()=>say("You walk away from Mundungus Fletcher with your purse intact.","你離開蒙當葛·弗列契，荷包完好無損。","meet")) ]);
  sayB(t, first?"meet":"");
}

function randomEvent(){ if(L.age<3||!chance(0.55)) return; const pool=EVENTS.filter(e=>e.w()>0&&(e.rep||!L.used.has(e))); if(pool.length){ const e=weighted(pool,e=>e.w()*(L.used.has(e)?0.3:1)); L.used.add(e); e.go(); } }

// ================= YEAR STEP =================
function stepYear(){
  if(!L.alive||pending) return;
  if(askQueue.length){ yearBuf=[]; ask(...askQueue.shift()); render(); return; }
  L.age++; L.spent=0; yearBuf=[]; makeNews(Y());
  examFinish();
  if(L.hpLive) hpFinish();
  if(L.age>=11) L.stats.rep=clamp(L.stats.rep+(38-L.stats.rep)*0.03);
  const s=L.stats, a=L.age;
  if(L.lostPending){ const lp=L.people.find(p=>p.id===L.lostPid); if(lp){ lp.alive=false; lp.died=Y(); } say(`Your baby ${L.lostPending.e} dies before their first birthday.`,`你的寶寶${L.lostPending.z}沒能活過一歲生日。`,"major bad"); mod("happy",-18); L.lostPending=null; }
  if(chance(deathProb())){ die(deathCause()); flush(); render(); endLife(); return; }
  s.health=clamp(s.health+(healthTarget()-s.health)*0.12+rint(-2,2));
  s.happy=clamp(s.happy+(58-s.happy)*0.1);
  s.friends=clamp(s.friends-0.8);
  if(atSchool()) mod("magic",L.tt&&L.tt.y===Y()-1?1.5+0.6*L.tt.slots.filter(Boolean).length:4); else if(a<(L.magical?110:70)) mod("magic",0.5); else mod("magic",-0.5);
  if(a>=17) mod("gold",(L.career?L.income:1.2)-2.6-L.kids*0.5);
  if(L.career&&!L.retired&&!L.azkaban) L.jobYears=(L.jobYears||0)+1;
  if(L.invest){ const r=pick([25,25,15,15,15,0,0]); mod("gold",r); r?say(`Your Gringotts investment pays back ${r} Galleons.`,`你在古靈閣的投資回收了 ${r} 金加隆。`,"good"):say("Your Gringotts investment loses everything. The goblins are unapologetic.","你在古靈閣的投資血本無歸。妖精們毫無歉意。","bad"); L.invest=0; }
  if(L.loan&&L.loan===Y()){ L.loan=0; if(chance(0.6)){ mod("gold",10); say("Your friend pays back the 10 Galleons, with a box of Chocolate Frogs.","朋友還了你 10 金加隆，還附上一盒巧克力蛙。","good"); } else say("Your friend never pays you back. You stop mentioning it.","朋友始終沒有還錢。你也不再提了。","bad"); }
  peopleYear();
  moralYear();
  if(!L.sawDeath&&L.people.some(p=>!p.alive)) L.sawDeath=Y();
  if(atSchool()&&!L.azkaban) clubYear();
  if(L.adultClub&&!atSchool()&&!L.azkaban) adultClubYear();
  if(L.azkaban){ L.azkaban--; mod("health",-8); mod("happy",-12); mod("friends",-4);
    if(L.azkaban) say("Another year in Azkaban. The Dementors take every happy memory you have.","又一年在阿茲卡班度過。催狂魔奪走了你所有快樂的回憶。","bad");
    else { say("You're released from Azkaban, thin and grey.","你從阿茲卡班獲釋，消瘦而憔悴。","major"); L.side=null; L.career=null; L.income=1.5; } }
  else if(a>=FOCUS[L.focus].min){
    const f=L.focus;
    if(f==="study"){ mod("magic",atSchool()?4:3); mod("happy",-1); }
    if(f==="rest"){ mod("health",3); mod("happy",1); }
    if(f==="friends"){ mod("friends",5); mod("happy",2); }
    if(f==="work"){ mod("gold",1+L.income*0.5); mod("health",-1); mod("friends",-2); }
    if(f==="fun"){ const sp=Math.min(3,s.gold); mod("gold",-sp); mod("happy",2+sp); }
  }
  history();
  if(L.alive&&!L.azkaban) milestones();
  if(L.alive&&!L.azkaban) familyYear();
  if(L.alive&&!L.azkaban) kidsYear();
  if(L.alive&&!L.azkaban) orderYear();
  if(L.alive&&!L.azkaban&&L.age>=6&&chance(0.45)) birthdayEvent();
  if(L.alive&&!L.azkaban&&L.career&&!L.retired&&L.age>=18&&!atSchool()&&true){ if(chance(L.age<40?0.65:0.5)) workEvent(); else jobFlavor(); }
  if(L.alive&&!L.azkaban&&!L.disaster&&L.age>=20&&!atSchool()&&chance(L.magical&&((Y()>=1970&&Y()<=1981)||(Y()>=1995&&Y()<=1998))?0.02:((Y()===1940||Y()===1941)&&L.inLondon?0.05:0.001))){ L.disaster=true; homeDisaster(); }
  if(L.alive&&!L.azkaban&&!pending) encounter();
  if(L.alive&&!L.azkaban&&!pending) randomEvent();
  if(!L.alive){ flush(); render(); endLife(); return; }
  if(!yearBuf.length) sayP(a<11?[B("An ordinary year.","平凡的一年。"),B("You grow a little taller.","你又長高了一點。")]:atSchool()?[B("Homework, Quidditch and too much treacle tart.","作業、魁地奇，還有吃太多的糖蜜餡餅。"),B("A quiet year at school.","在學校平靜的一年。")]:[B("A quiet year.","平靜的一年。"),B("The days blur together.","日子一天天模糊地過去。"),B("An ordinary year of work and family.","工作與家庭，平凡的一年。"),B("You read a lot of books this year.","今年你讀了很多書。"),B("You finally learn to cook something other than toast.","你終於學會煮吐司以外的東西了。"),B("A wet summer. You spend it indoors playing Exploding Snap.","多雨的夏天。你整個夏天都待在家裡玩爆炸牌。"),B("You redecorate the kitchen. Twice.","你把廚房重新裝潢了。兩次。"),B("You take long walks and think about the past.","你常常散步，回想往事。"),B("Nothing much happens, and that's fine.","沒發生什麼事，這樣也很好。"),B("You start keeping a diary.","你開始寫日記。")]);
  flush(); render();
}

function openSpend(){
  if(!canSpend()) return;
  const s=L.stats, left=SPEND_LIMIT-(L.spent||0);
  const items=spendItems().filter(i=>!i.need||i.need());
  stopAuto(); pending=true;
  const finish=i=>{ $("scrim").classList.remove("open"); pending=false; currentModal=null; L.spent=(L.spent||0)+1; yearBuf=[]; mod("gold",-i.c); i.go(); flush(); render(); };
  const options=items.map(i=>{ const broke=s.gold<i.c; const extra=i.s?` · ${i.s.e}`:"", extraZ=i.s?` · ${i.s.z}`:"";
    return {label:i.l,sub:B(`−${i.c} Galleons${extra}${broke?" · can't afford":""}`,`−${i.c} 金加隆${extraZ}${broke?" · 買不起":""}`),disabled:broke,go:()=>finish(i)}; });
  options.push({label:B("Never mind","算了"),go:()=>{ $("scrim").classList.remove("open"); pending=false; currentModal=null; render(); }});
  currentModal={kicker:B(`Galleons ${Math.round(s.gold)} / 100`,`金加隆 ${Math.round(s.gold)} / 100`),title:B(L.age<17?"Spend your pocket money":"Spend Galleons",L.age<17?"花零用錢":"花費金加隆"),text:B(`${left} purchase${left>1?"s":""} left this year.`,`今年還能買 ${left} 次。`),options,custom:true};
  drawModal(); $("scrim").classList.add("open");
}

function eraLabel(y){
  if(y<1926) return [B("Early twentieth century","二十世紀初"),false]; if(y<=1945) return [B("Grindelwald era","葛林戴華德時代"),y>=1939];
  if(y<1970) return [B("Post-war peace","戰後和平"),false]; if(y<=1981) return [B("First Wizarding War","第一次巫師戰爭"),true];
  if(y<1995) return [B("The Boy Who Lived","活下來的男孩"),false]; if(y<=1998) return [B("Second Wizarding War","第二次巫師戰爭"),true];
  return [B("After the war","戰後"),false];
}
