function renderProphet(){
  const years=Object.keys(L.news).map(Number).sort((a,b)=>b-a);
  const y=prophetYear&&L.news[prophetYear]?prophetYear:years[0], n=L.news[y];
  if(!n){ $("prophet").innerHTML=""; return; }
  $("prophet").innerHTML=`<article class="paper">
    <div class="mast">${tx(B("The Daily Prophet","預言家日報"))}</div>
    <div class="dateline"><span>${tx(B(`Britain's leading wizarding newspaper · ${y}`,`英國首屈一指的巫師報紙 · ${y} 年`))}</span>
      <label>${tx(B("Edition","期數"))} <select id="pyear">${years.map(v=>`<option value="${v}" ${v===y?"selected":""}>${v}</option>`).join("")}</select></label></div>
    <h3 class="headline">${tx(n.head)}</h3>
    <div class="cols">${n.items.map(i=>`<p><b>${tx(i.tag)}</b>${tx(i.t)}</p>`).join("")}</div>
    ${n.notices.length?`<div class="notices"><div class="nh">${tx(B("Announcements","啟事"))}</div>${n.notices.map(x=>`<p>${tx(x)}</p>`).join("")}</div>`:""}
    <div class="price">${tx(B("Price: 5 Knuts","售價：5 納特"))}</div>
  </article>`;
  $("pyear").onchange=e=>{ const v=+e.target.value; prophetYear=v===years[0]?null:v; renderProphet(); };
}
function personRow(p){
  const st=p.parent&&p.alive?(p.close>=70?B("Very close","非常親密"):p.close>=45?B("Close","親近"):p.close>=25?B("Distant","疏遠"):B("Estranged","決裂")):statusOf(p), label=p.parent?B(`${p.kin.e} · ${p.job.e.replace(/^(an?|the) /,"")}${p.magical?"":" (Muggle)"} · ${STYLE[p.style].b.e}`,`${p.kin.z} · ${p.job.z}${p.magical?"":"(麻瓜)"} · ${STYLE[p.style].b.z}`):p.kin?(p.job?B(`${p.kin.e} · ${p.job.e.replace(/^an? /,"")}`,`${p.kin.z} · ${p.job.z}`):p.squib?B(`${p.kin.e} · Squib`,`${p.kin.z} · 爆竹`):p.kin):p.met?B(`Met at ${p.met.e}`,`相識於${p.met.z}`):B("","");
  const house=p.house&&!(p.met&&p.met.e.includes(p.house))?` · ${hname(p.house)}`:"";
  const cls=!p.alive?"dead":p.role==="rival"||(p.parent&&p.close<25)?"rival":p.close>=80?"best":p.close>=60?"close":"";
  return `<div class="person ${p.alive?"":"gone"}"><div class="pn"><b>${tx(p.name)}</b><small>${tx(label)}${house}${!p.alive&&p.died?` · †${p.died}`:""}</small></div>
    <div class="cbar" title="${Math.round(p.close)}"><i style="width:${p.alive?p.close:0}%"></i></div>${st?`<span class="pill ${cls}">${tx(st)}</span>`:"<span></span>"}</div>`;
}
function renderRel(){
  const g=(t,list)=>list.length?`<div class="sect">${tx(t)}</div>${list.map(personRow).join("")}`:"";
  const fam=L.people.filter(p=>p.role==="family");
  const home=L.people.filter(p=>p.role==="dating"||p.role==="partner"||p.role==="ex"||p.role==="child");
  const fr=L.people.filter(p=>p.role==="friend").sort((a,b)=>(b.alive-a.alive)||(b.close-a.close));
  const rv=L.people.filter(p=>p.role==="rival");
  const best=fr.filter(p=>p.alive&&p.close>=60).length;
  $("rel").innerHTML=`<p class="relsum">${tx(B(`${best} close friend${best===1?"":"s"} · ${fr.filter(p=>p.alive).length} friends and acquaintances · ${L.met.size} famous people met. Spend your focus on Friends to grow closer.`,`${best} 位好友 · ${fr.filter(p=>p.alive).length} 位朋友與熟人 · 遇見 ${L.met.size} 位名人。把重心放在「朋友」能拉近關係。`))}</p>
    ${g(B("Family","家人"),fam)}${g(B("Partner and children","伴侶與子女"),home)}${g(B("Friends","朋友"),fr)}${g(B("Rivals","死對頭"),rv)}
    ${L.met.size?`<div class="sect">${tx(B("Famous people you've met","你遇見的名人"))}</div><div class="metlist">${[...L.met].map(n=>`<span>${pname(n)}</span>`).join("")}</div>`:""}`;
}
function closest(){ return L.people.filter(p=>p.role!=="rival"&&p.role!=="ex").sort((a,b)=>b.close-a.close).slice(0,4); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

// ================= AUTO / FLOW =================
function setAutoLabel(){ $("autoBtn").textContent=tx(autoTimer?I18N.pause:I18N.auto); }
function startAuto(){ if(autoTimer) return; autoTimer=setInterval(()=>{ if(pending||!L.alive){ stopAuto(); return; } stepYear(); },750); setAutoLabel(); }
function stopAuto(){ clearInterval(autoTimer); autoTimer=null; setAutoLabel(); }
function show(id){ ["start","game","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); window.scrollTo(0,0); }
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function begin(){
  stopAuto(); askQueue=[]; pending=false; currentModal=null; $("scrim").classList.remove("open");
  newLife(); $("log").innerHTML=""; yearBuf=[]; prophetYear=null; makeNews(L.by); notice(B(`Births: to the ${L.last.e} family, ${L.gender==="m"?"a son":"a daughter"}, ${L.first.e}.`,`出生：${L.last.z}家喜獲${L.gender==="m"?"麟兒":"千金"}${L.first.z}。`));
  const le=Math.round(ukAt(L.by,1)), imr=Math.round(ukAt(L.by,2));
  say(`You are born in ${L.place.e} in ${MONTHS[L.bm-1]} ${L.by}. Your parents name you ${L.first.e}.`,`你在 ${L.by} 年 ${L.bm} 月出生於${L.place.z}。父母為你取名${L.first.z}。`,"major");
  const bl={pure:B("Your family is pure-blood, and never lets anyone forget it.","你家是純種巫師家族，而且從不讓人忘記這一點。"),half:B("One of your parents is a witch or wizard, the other isn't.","你的父母一方是巫師，另一方不是。"),muggle:B("Your parents are Muggles. Nobody suspects a thing.","你的父母都是麻瓜。沒有人察覺到任何異樣。"),squib:B("Your parents are both magical. They're waiting to see if you are too.","你的父母都是巫師。他們在等著看你是不是也是。")}[L.blood];
  sayB(bl);
  familyIntro();
  say(`In ${L.by}, about ${imr} of every 1,000 babies in Britain die before their first birthday, and life expectancy at birth is ${le}.`,`${L.by} 年的英國，每 1,000 名嬰兒約有 ${imr} 名活不到一歲，出生時預期壽命為 ${le} 歲。`,"world");
  const [el]=eraLabel(L.by); say(`You're born into the ${el.e==="After the war"?"years after the war":el.e}.`,`你出生在${el.z}時期。`,"world");
  flush(); render(); show("game");
}
function endLife(){
  stopAuto(); L.alive=false; checkAch(); notice(B(`Obituary: ${L.name.e}, ${L.by}–${Y()}.`,`訃聞：${L.name.z}(${L.by}–${Y()})。`)); drawEnd();
  past.unshift({name:L.name,house:L.house,by:L.by,age:L.age,met:L.met.size}); past=past.slice(0,8);
  try{ localStorage.setItem("wizLife_past2",JSON.stringify(past)); }catch(e){}
  renderPast(); renderAchStart(); setTimeout(()=>show("end"),900);
}
function drawEnd(){
  setTimeout(()=>{ const c=document.getElementById("endPx"); if(c) drawPortrait(c); },0);
  if(!L||L.alive) return;
  const y=Y(), le=Math.round(ukAt(L.by,1)), wle=le+20, zh=lang==="zh";
  const moments=L.major.filter(m=>!/^You die/.test(m.t.e)).slice(-14);
  const verdict= L.age<5?B("A life that had barely begun.","一段才剛開始的人生。")
    : L.hero?B("They fought at Hogwarts when it mattered.","在最關鍵的時刻，他們在霍格華茲挺身而戰。")
    : L.met.size>=8?B("An ordinary life that kept brushing against history.","一段平凡的人生，卻一再與歷史擦肩而過。")
    : L.age>=wle+10?B("A long life, even by wizarding standards.","即使以巫師的標準，也是長壽的一生。")
    : L.age>=(L.magical?wle:le)-5?B("A full life, about as long as most.","圓滿的一生，壽命和大多數人差不多。")
    : B("A life cut shorter than it should have been.","一段本不該這麼短的人生。");
  $("recordCard").style.setProperty("--hc",L.house?HOUSES[L.house]:"var(--rule)");
  const meta=[`${L.by} – ${y}`,tx(BLOOD[L.blood]),L.house?hname(L.house):null,L.career?tx(jobTitle()):null,zh?`出生於${L.place.z}`:`born ${L.place.e}`].filter(Boolean).join(" · ");
  $("recordCard").innerHTML=`
    <div class="endtop"><canvas id="endPx" width="16" height="16"></canvas><h2>${tx(L.name)}</h2></div>
    <div class="life">${meta}</div>
    <div class="cause">${tx((L.evil||0)>65?B("Remembered as a notorious figure.","人們記得你是個惡名昭彰的人物。"):L.stats.rep>=75?B("Remembered as a pillar of the wizarding community.","人們記得你是巫師界的中流砥柱。"):L.stats.rep>=55?B("Remembered fondly by many.","許多人懷念你。"):L.stats.rep>=30?B("Remembered by those who knew you.","認識你的人會記得你。"):L.stats.rep>=15?B("Remembered, mostly, for the wrong reasons.","人們記得你，但大多是因為不好的事。"):B("Remembered as a notorious figure.","人們記得你是個惡名昭彰的人物。"))}</div>
    <div class="cause">${zh?`享年 ${L.age} 歲，死因：${L.cause.z}。`:`Died at age ${L.age} of ${L.cause.e}.`}</div>
    <div class="compare">
      <div><b>${L.age}</b>${tx(B("years lived","在世年數"))}</div>
      <div><b>${le}</b>${tx(B(`UK life expectancy for ${L.by} births`,`${L.by} 年出生的英國人預期壽命`))}</div>
      <div><b>${L.magical?wle:le}</b>${L.magical?tx(B("wizarding expectancy in this game","本遊戲中的巫師預期壽命")):tx(B("expectancy used for Squibs","爆竹採用的預期壽命"))}</div>
    </div>
    <div class="sect">${tx(B("Famous people you met","你遇見的名人"))}</div>
    <div class="metlist">${L.met.size?[...L.met].map(n=>`<span>${pname(n)}</span>`).join(""):`<em style="color:var(--muted)">${tx(B("None. A quiet life.","沒有。平靜的一生。"))}</em>`}</div>
    <div class="sect">${tx(B("Closest people","最親近的人"))}</div>
    <div class="metlist">${closest().map(p=>`<span>${tx(p.name)} · ${tx(p.kin||statusOf(p))}</span>`).join("")||`<em style="color:var(--muted)">—</em>`}</div>
    ${(L.inv||[]).filter(i=>!i.sold).length?`<div class="sect">${tx(B("What you left behind","你留下的東西"))}</div><div class="metlist">${L.inv.filter(i=>!i.sold).slice(0,12).map(i=>`<span>${tx(ITEMS[i.k].n)}</span>`).join("")}</div>`:""}
    ${(L.ach||[]).length?`<div class="sect">${tx(B("Achievements","成就"))}</div><div class="metlist">${L.ach.map(id=>`<span>${tx(ACH.find(a=>a.id===id).n)}</span>`).join("")}</div>`:""}
    <div class="sect">${tx(B("Moments","重要時刻"))}</div>
    <ul class="highlights">${moments.map(m=>`<li><span>${m.y} · ${m.age}</span>${tx(m.t)}</li>`).join("")}</ul>
    <p class="epitaph">${tx(verdict)}</p>`;
}
let past=[]; try{ past=JSON.parse(localStorage.getItem("wizLife_past2")||"[]"); }catch(e){ past=[]; }
function renderPast(){ $("pastWrap").classList.toggle("hidden",!past.length); $("pastList").innerHTML=past.map(p=>`<div class="pastrow"><span>${tx(p.name)}${p.house?`${lang==="zh"?"，":", "}${hname(p.house)}`:""}</span><span>${p.by}–${p.by+p.age} · ${tx(B(`met ${p.met}`,`遇見 ${p.met} 位`))}</span></div>`).join(""); }
function renderStart(){
  $("refTable").innerHTML=UK.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3].toFixed(1)}</td></tr>`).join("");
  $("eraPick").innerHTML=ERAS.map(e=>`<button class="chip" data-e="${e.k}" aria-pressed="${e.k===eraChoice}">${tx(e.l)}</button>`).join("");
  $("eraPick").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ eraChoice=b.dataset.e; renderStart(); });
  renderAchStart();
  $("timeline").innerHTML=TIMELINE.map(([y,t])=>`<div><span>${y}</span>${tx(t)}</div>`).join("");
}
function applyLang(){
  document.documentElement.lang=lang==="zh"?"zh-Hant":"en";
  document.title=lang==="zh"?"巫師人生 · A Wizarding Life":"A Wizarding Life";
  document.querySelectorAll("[data-i]").forEach(el=>{ el.innerHTML=tx(I18N[el.dataset.i]); });
  $("langEn").setAttribute("aria-pressed",lang==="en"); $("langZh").setAttribute("aria-pressed",lang==="zh");
  setAutoLabel(); renderStart(); renderPast();
  if(L){ render(); rerenderLog(); drawEnd(); }
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(currentModal) drawModal();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{ localStorage.setItem("wizLife_lang",lang); }catch(e){} applyLang(); });
$("bornBtn").onclick=begin; $("againBtn").onclick=begin; $("homeBtn").onclick=()=>show("start");
$("nextBtn").onclick=()=>{ stopAuto(); stepYear(); };
$("autoBtn").onclick=()=>autoTimer?stopAuto():startAuto();
$("spendBtn").onclick=openSpend;
$("forestBtn").onclick=exploreForest;
applyLang();
</script>
</body>
</html>
